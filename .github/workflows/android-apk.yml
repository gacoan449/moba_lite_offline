name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # three_js 0.2.x requires Dart >= 3.7.0. Flutter 3.47.2
          # ships with a compatible Dart SDK, while keeping the stable
          # Android build toolchain used by this project.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # Generate only the Android host project. This preserves the game's
      # Dart/lib source while ensuring Android Gradle files match the SDK.
      - run: flutter create --platforms=android --project-name=moba_lite_offline .
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moba-lite-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
