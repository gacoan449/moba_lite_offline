name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      # The repository contains the Flutter/Dart game code but was missing
      # the Android platform project. Generate a clean Android host project
      # before resolving packages and building the APK.
      - run: flutter create --platforms=android --project-name=moba_lite_offline .
      # flutter create generates a default widget_test.dart that expects MyApp.
      # This game uses its own GameWidget entry point, so remove that generated test.
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moba-lite-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
