name: Build Android APK

on:
  push:
    branches: [ main, feature/moba-25d-lite ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name=moba_lite_offline .
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moba-lite-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
