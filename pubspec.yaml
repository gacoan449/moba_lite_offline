name: moba_lite_offline
description: A lightweight original 2.5D fantasy MOBA for Flutter with native rendering and touch controls.
publish_to: 'none'

version: 2.1.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flame: ^1.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
