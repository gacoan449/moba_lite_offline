name: moba_lite_offline
description: A full 3D fantasy MOBA for Flutter with original battlefield, heroes, turrets, jungle, touch controls and keyboard support.
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  three_js: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
